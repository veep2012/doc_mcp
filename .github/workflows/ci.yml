name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # GitHub-hosted runners do not provide a Debian label. Run the job in a
    # Debian Bookworm container while retaining the hosted runner's Docker
    # daemon for the container-based smoke tests.
    container:
      image: node:22-bookworm
      options: --volume /var/run/docker.sock:/var/run/docker.sock

    steps:
      - name: Install Debian system dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            docker.io \
            git \
            make \
            python3 \
            python3-pip \
            python3-venv

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create virtual environment
        run: make local-venv

      - name: Run tests
        run: SMOKE_KEEP_ARTIFACTS=1 CONTAINER_BIN=docker make test

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: .local/smoke
          if-no-files-found: ignore
