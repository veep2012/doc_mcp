[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-mcp"
version = "1.1.2"
description = "Documentation MCP server with Playwright-based authentication and crawling"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Documentation",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
  "playwright==1.61.0",
  "markdownify==1.2.3",
  "pypdf==6.15.0",
  "mcp==1.28.1",
  "PyYAML==6.0.3",
  "python-dotenv==1.2.2",
  "fastembed==0.8.0",
  "sqlite-vec==0.1.9",
]

[project.scripts]
docmcp-server = "docmcp.main:main"
docmcp-auth = "docmcp.auth_cli:main"
docmcp-crawl = "docmcp.crawl_cli:main"
docmcp-vectorize = "docmcp.vectorize_cli:main"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["docmcp*"]
