[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-mcp"
version = "1.1.2"
description = "Documentation MCP server with Playwright-based authentication and crawling"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Documentation",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
[project.scripts]
docmcp-server = "docmcp.main:main"
docmcp-auth = "docmcp.auth_cli:main"
docmcp-crawl = "docmcp.crawl_cli:main"
docmcp-vectorize = "docmcp.vectorize_cli:main"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
include = ["docmcp*"]
